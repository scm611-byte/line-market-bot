name: 盤後推播

on:
  schedule:
    - cron: "0 8 * * 1-5"    # 台股：台北 週一～五 16:00
    - cron: "30 22 * * 1-5"  # 美股：台北 週二～六 06:30（紐約收盤後）
  workflow_dispatch:
    inputs:
      market:
        description: "tw 或 us"
        required: true
        default: tw

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Pick market
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ]; then
            echo "market=tw" >> "$GITHUB_OUTPUT"
          else
            echo "market=us" >> "$GITHUB_OUTPUT"
          fi
      - name: Wake up Render
        # 免費方案會休眠，先叫醒（最多等約 3 分鐘）
        run: curl -sf --retry 6 --retry-delay 20 --retry-all-errors --max-time 60 "${{ secrets.BOT_URL }}/" 
      - name: Trigger push
        run: |
          curl -sf --max-time 120 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" \
            "${{ secrets.BOT_URL }}/tasks/${{ steps.m.outputs.market }}"
