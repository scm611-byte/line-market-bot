name: 台股盤後推播

on:
  schedule:
    # 主要排程在 cron-job.org（準時）；這裡是備援，GitHub 排程常延遲數小時。
    # Bot 端一天只會推一次，兩邊都觸發也不會重複。
    - cron: "17 8 * * 1-5"  # 台北 週一～五 16:17（GitHub 用 UTC）
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render
        # 免費方案會休眠，先叫醒（最多等約 3 分鐘）
        run: curl -sf --retry 6 --retry-delay 20 --retry-all-errors --max-time 60 "${{ secrets.BOT_URL }}/"
      - name: Trigger push
        # 回 204 代表今天休市，不會推播
        run: |
          curl -sf --max-time 120 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" \
            "${{ secrets.BOT_URL }}/tasks/tw"
